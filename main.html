<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-sacle=1.0">
    <title>뽑아뽑아밥묵자</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>메인 메뉴 추천</h1>

    <select id="category1">
        <option value="전체메뉴">전체메뉴</option>
        <option value="한식">한식</option>
        <option value="일식">일식</option>
        <option value="중식">중식</option>
        <option value="패스트푸드">패스트푸드</option>

    </select>

    <button id="foodpick">랜덤뽑기</button>

    <div id="result1"></div>

    <h1>후식 추천</h1>

    <select id="category2">
        <option value="전체메뉴">전체메뉴</option>
        <option value="커피/음료">커피/음료</option>
        <option value="디저트">디저트</option>
    </select>

    <button id="dessertpick">랜덤뽑기</button>

    <div id="result2"></div>

    <script>
        let btn1 = document.querySelector("#foodpick");
        let box1 = document.querySelector("#result1");
        
        btn1.addEventListener("click", function () {
            alert("눌림");
            box1.textContent = "음식 이름 + 사진 추가";
            box1.style.color = "black";
            box1.style.backgroundImage = "url('budaejjigae.png')";
        });

        let btn2 = document.querySelector("#dessertpick");
        let box2 = document.querySelector("#result2");
        
        btn2.addEventListener("click", function () {
            alert("눌림");
            box2.textContent = "음식 이름 + 사진 추가";
            box2.style.color = "black";
        });
    </script>
</body>

</html>
